<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>กล้องถ่ายรูป & อัปโหลด - ບຸນຊູ</title>
  
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100vh;
      width: 100%;
      position: relative;
    }

    .screen.active {
      display: flex;
    }

    /* --- หน้ากล้องถ่ายรูป --- */
    #camera-viewport {
      flex: 1;
      width: 100%;
      object-fit: cover;
      background-color: #000000;
    }

    .camera-controls {
      height: 120px;
      background-color: rgba(15, 23, 42, 0.95);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 20px;
    }

    .btn-capture {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      background-color: #ef4444;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .btn-capture:active {
      transform: scale(0.9);
    }

    .btn-gallery {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    /* --- หน้าพรีวิวและตั้งชื่อ --- */
    .preview-header {
      padding: 16px;
      background-color: #1e293b;
    }

    .input-filename {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 16px;
      outline: none;
    }

    .input-filename:focus {
      border-color: #3b82f6;
    }

    .preview-body {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      background-color: #000000;
      overflow: hidden;
    }

    #preview-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .preview-footer {
      padding: 16px;
      background-color: #1e293b;
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-cancel {
      background-color: #475569;
      color: #ffffff;
    }

    .btn-upload {
      background-color: #2563eb;
      color: #ffffff;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Loading Overlay */
    #loading-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 16px;
      z-index: 100;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- หน้าที่ 1: กล้องถ่ายรูป -->
  <div id="screen-camera" class="screen active">
    <video id="camera-viewport" autoplay playsinline></video>
    
    <div class="camera-controls">
      <button class="btn-gallery" onclick="document.getElementById('file-input').click()">
        <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
        แกลเลอรี
      </button>
      <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleGallerySelect(event)">

      <button class="btn-capture" onclick="takePhoto()"></button>
      
      <div style="width: 50px;"></div>
    </div>
  </div>

  <!-- หน้าที่ 2: พรีวิวรูป & ตั้งชื่อ -->
  <div id="screen-preview" class="screen">
    <div class="preview-header">
      <input type="text" id="image-name" class="input-filename" placeholder="พิมพ์ชื่อรูปภาพที่นี่...">
    </div>

    <div class="preview-body">
      <img id="preview-image" src="" alt="Preview Image">
    </div>

    <div class="preview-footer">
      <button class="btn btn-cancel" onclick="resetToCamera()">ยกเลิก</button>
      <button class="btn btn-upload" id="btn-submit" onclick="uploadImage()">อัปโหลด</button>
    </div>

    <!-- Loading Screen -->
    <div id="loading-overlay">
      <div class="spinner"></div>
      <p>กำลังอัปโหลดไปยัง Google Drive...</p>
    </div>
  </div>

  <canvas id="photo-canvas" style="display: none;"></canvas>

  <script>
    // ** นำ URL ของ Web App จาก Google Apps Script มาวางแทนที่บรรทัดนี้ **
    const GAS_ENDPOINT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

    let currentStream = null;
    let imageBase64Data = "";

    async function startCamera() {
      try {
        const constraints = {
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        const video = document.getElementById('camera-viewport');
        video.srcObject = currentStream;
      } catch (err) {
        alert("ไม่สามารถเปิดกล้องได้: " + err.message);
      }
    }

    function stopCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
    }

    function takePhoto() {
      const video = document.getElementById('camera-viewport');
      const canvas = document.getElementById('photo-canvas');
      
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      imageBase64Data = canvas.toDataURL('image/jpeg', 0.85);
      showPreview(imageBase64Data);
    }

    function handleGallerySelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        imageBase64Data = e.target.result;
        showPreview(imageBase64Data);
      };
      reader.readAsDataURL(file);
    }

    function showPreview(src) {
      stopCamera();
      document.getElementById('preview-image').src = src;
      document.getElementById('image-name').value = "";
      
      document.getElementById('screen-camera').classList.remove('active');
      document.getElementById('screen-preview').classList.add('active');
    }

    function resetToCamera() {
      document.getElementById('screen-preview').classList.remove('active');
      document.getElementById('screen-camera').classList.add('active');
      document.getElementById('loading-overlay').style.display = 'none';
      document.getElementById('btn-submit').disabled = false;
      document.getElementById('file-input').value = "";
      startCamera();
    }

    async function uploadImage() {
      const customName = document.getElementById('image-name').value.trim();
      if (!customName) {
        alert("กรุณาพิมพ์ชื่อรูปภาพก่อนอัปโหลดครับ");
        return;
      }

      if (GAS_ENDPOINT_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
        alert("กรุณาใส่ GAS_ENDPOINT_URL ก่อนครับ");
        return;
      }

      document.getElementById('loading-overlay').style.display = 'flex';
      document.getElementById('btn-submit').disabled = true;

      const base64Content = imageBase64Data.split(',')[1];

      const payload = {
        filename: customName,
        mimeType: "image/jpeg",
        base64: base64Content
      };

      try {
        const response = await fetch(GAS_ENDPOINT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          alert("อัปโหลดลงโฟลเดอร์ ບຸນຊູ เรียบร้อยแล้ว!");
          resetToCamera();
        } else {
          alert("เกิดข้อผิดพลาด: " + result.message);
          document.getElementById('loading-overlay').style.display = 'none';
          document.getElementById('btn-submit').disabled = false;
        }
      } catch (err) {
        alert("การส่งข้อมูลล้มเหลว: " + err.message);
        document.getElementById('loading-overlay').style.display = 'none';
        document.getElementById('btn-submit').disabled = false;
      }
    }

    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
