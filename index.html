<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>กล้องถ่ายรูป & อัปโหลด - ບຸນຊູ</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", "Noto Sans Lao", Helvetica, Arial, sans-serif; }

    html, body { height: 100%; overflow: hidden; background: #0f172a; color: #fff; }

    /* ใช้ dvh = ความสูงที่เห็นจริงบนมือถือ (ไม่รวมแถบ URL) */
    .screen {
      display: none;
      flex-direction: column;
      position: fixed;
      inset: 0;
      height: 100vh;
      height: 100dvh;
      width: 100%;
    }
    .screen.active { display: flex; }

    /* --- หน้ากล้อง --- */
    .camera-wrap { flex: 1; min-height: 0; position: relative; background: #000; }
    #camera-viewport { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }

    .camera-controls {
      flex: 0 0 auto;
      min-height: 110px;
      padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
      background: #0f172a;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    .btn-capture {
      width: 76px; height: 76px; border-radius: 50%;
      border: 4px solid #fff; background: #ef4444; cursor: pointer;
      transition: transform .1s;
    }
    .btn-capture:active { transform: scale(.9); }
    .btn-gallery {
      justify-self: start;
      background: none; border: none; color: #fff; font-size: 14px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }

    /* --- หน้าพรีวิว --- */
    .preview-header { flex: 0 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px 16px; background: #1e293b; }
    .input-filename {
      width: 100%; padding: 12px 16px; border-radius: 8px;
      border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; outline: none;
    }
    .input-filename:focus { border-color: #3b82f6; }

    .preview-body {
      flex: 1; min-height: 0; padding: 16px; background: #000;
      display: flex; justify-content: center; align-items: center; overflow: hidden;
    }
    #preview-image { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }

    .preview-footer {
      flex: 0 0 auto; display: flex; gap: 12px;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); background: #1e293b;
    }
    .btn { flex: 1; padding: 14px; border-radius: 8px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; }
    .btn-cancel { background: #475569; color: #fff; }
    .btn-upload { background: #2563eb; color: #fff; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    #loading-overlay {
      display: none; position: absolute; inset: 0; background: rgba(0,0,0,.85);
      justify-content: center; align-items: center; flex-direction: column; gap: 16px; z-index: 100;
    }
    .spinner { width: 40px; height: 40px; border: 4px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- หน้า 1: กล้อง -->
  <div id="screen-camera" class="screen active">
    <div class="camera-wrap">
      <video id="camera-viewport" autoplay playsinline muted></video>
    </div>
    <div class="camera-controls">
      <button class="btn-gallery" onclick="document.getElementById('file-input').click()">
        <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
        แกลเลอรี
      </button>
      <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleGallerySelect(event)">
      <button class="btn-capture" onclick="takePhoto()" aria-label="ถ่ายรูป"></button>
      <div></div>
    </div>
  </div>

  <!-- หน้า 2: พรีวิว & ตั้งชื่อ -->
  <div id="screen-preview" class="screen">
    <div class="preview-header">
      <input type="text" id="image-name" class="input-filename" placeholder="พิมพ์ชื่อรูปภาพที่นี่...">
    </div>
    <div class="preview-body">
      <img id="preview-image" src="" alt="Preview Image">
    </div>
    <div class="preview-footer">
      <button class="btn btn-cancel" onclick="resetToCamera()">ยกเลิก</button>
      <button class="btn btn-upload" id="btn-submit" onclick="uploadImage()">อัปโหลด</button>
    </div>
    <div id="loading-overlay">
      <div class="spinner"></div>
      <p>กำลังอัปโหลดไปยัง Google Drive...</p>
    </div>
  </div>

  <canvas id="photo-canvas" style="display:none"></canvas>

  <script>
    // ** วาง URL Web App จาก Google Apps Script แทนบรรทัดนี้ **
    const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbwcEjNUKuzLjSA_t1Y1aL1CGWou0dbZfGUWGJpXxNyMGqKYS1hCG4ir6WVudo1d9CEF/exec";
    const MAX_SIZE = 1920; // ย่อรูปให้ด้านยาวสุดไม่เกินนี้ (อัปโหลดเร็วขึ้น)

    let currentStream = null;
    let imageBase64Data = "";

    async function startCamera() {
      try {
        stopCamera();
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        document.getElementById('camera-viewport').srcObject = currentStream;
      } catch (err) {
        alert("ไม่สามารถเปิดกล้องได้: " + err.message);
      }
    }

    function stopCamera() {
      if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
    }

    // ย่อรูปด้วย canvas แล้วคืนเป็น JPEG base64
    function resizeToJpeg(source, w, h) {
      const scale = Math.min(1, MAX_SIZE / Math.max(w, h));
      const canvas = document.getElementById('photo-canvas');
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      canvas.getContext('2d').drawImage(source, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.85);
    }

    function takePhoto() {
      const video = document.getElementById('camera-viewport');
      if (!video.videoWidth) { alert("กล้องยังไม่พร้อม กรุณารอสักครู่"); return; }
      imageBase64Data = resizeToJpeg(video, video.videoWidth, video.videoHeight);
      showPreview(imageBase64Data);
    }

    function handleGallerySelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        imageBase64Data = resizeToJpeg(img, img.naturalWidth, img.naturalHeight);
        URL.revokeObjectURL(url);
        showPreview(imageBase64Data);
      };
      img.onerror = () => alert("เปิดรูปภาพนี้ไม่ได้");
      img.src = url;
    }

    function showPreview(src) {
      stopCamera();
      document.getElementById('preview-image').src = src;
      document.getElementById('image-name').value = "";
      document.getElementById('screen-camera').classList.remove('active');
      document.getElementById('screen-preview').classList.add('active');
    }

    function resetToCamera() {
      document.getElementById('screen-preview').classList.remove('active');
      document.getElementById('screen-camera').classList.add('active');
      document.getElementById('loading-overlay').style.display = 'none';
      document.getElementById('btn-submit').disabled = false;
      document.getElementById('file-input').value = "";
      startCamera();
    }

    async function uploadImage() {
      const customName = document.getElementById('image-name').value.trim();
      if (!customName) { alert("กรุณาพิมพ์ชื่อรูปภาพก่อนอัปโหลดครับ"); return; }
      if (GAS_ENDPOINT_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") { alert("กรุณาใส่ GAS_ENDPOINT_URL ก่อนครับ"); return; }

      document.getElementById('loading-overlay').style.display = 'flex';
      document.getElementById('btn-submit').disabled = true;

      const payload = { filename: customName, mimeType: "image/jpeg", base64: imageBase64Data.split(',')[1] };

      try {
        // ไม่ใส่ headers เพื่อเลี่ยง CORS preflight ของ Apps Script
        const response = await fetch(GAS_ENDPOINT_URL, { method: "POST", body: JSON.stringify(payload) });
        const result = await response.json();
        if (result.status === "success") {
          alert("อัปโหลดลงโฟลเดอร์ ບຸນຊູ เรียบร้อยแล้ว!");
          resetToCamera();
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        alert("การส่งข้อมูลล้มเหลว: " + err.message);
        document.getElementById('loading-overlay').style.display = 'none';
        document.getElementById('btn-submit').disabled = false;
      }
    }

    window.addEventListener('DOMContentLoaded', startCamera);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</body>
</html>
